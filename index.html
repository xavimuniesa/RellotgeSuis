<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rellotge estil estació suïssa</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #000000;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(0.5rem, 2vh, 1.5rem) clamp(0.75rem, 3vw, 1.5rem);
    box-sizing: border-box;
    min-height: 100dvh;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(0.6rem, 2vh, 1.25rem);
    width: 100%;
    max-width: 420px;
  }
  .col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 1.6vh, 14px);
    width: 100%;
  }
  .clock-case {
    background: linear-gradient(135deg, #3a3a3a 0%, #1c1c1c 45%, #0a0a0a 100%);
    border-radius: 50%;
    padding: clamp(4px, 0.8vmin, 7px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  }

  /* Mecanisme de gir horari: cara davantera (esfera) i cara posterior
     (placa platejada amb la bandera suïssa), amb una capa negra intermitja
     que evita que es vegi transparent pel lateral durant el gir. */
  .clock-flip-wrap {
    perspective: 1800px;
  }
  .clock-flip {
    position: relative;
    display: inline-block;
    transform-style: preserve-3d;
  }
  .clock-flip.girant {
    animation: girRellotge var(--gir-dur, 10s) cubic-bezier(.45,.05,.55,.95);
  }
  @keyframes girRellotge {
    from { transform: rotateY(0deg); }
    to   { transform: rotateY(360deg); }
  }
  .clock-edge {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, #3a3a3a 0%, #1c1c1c 45%, #0a0a0a 100%);
  }
  .clock-face-front {
    position: relative;
    transform: translateZ(20px);
    backface-visibility: hidden;
  }
  .clock-face-back {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    transform: rotateY(180deg) translateZ(20px);
    backface-visibility: hidden;
    background: linear-gradient(135deg, #3a3a3a 0%, #1c1c1c 45%, #0a0a0a 100%);
    padding: clamp(4px, 0.8vmin, 7px);
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .clock-back-plate {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f6f7f8 0%, #dde1e4 24%, #b4bac0 50%, #7d838a 76%, #45474b 100%);
    box-shadow: inset 0 0 26px rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .back-flag {
    width: 50%;
    height: 50%;
    display: block;
  }
  #clock {
    width: clamp(160px, 62vmin, 340px);
    height: clamp(160px, 62vmin, 340px);
    display: block;
  }
  #calHeader {
    text-align: center;
    font-size: clamp(19px, 4vmin, 30px);
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: clamp(6px, 1vh, 14px);
    color: #ffffff;
    text-transform: capitalize;
  }
  #calGrid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: clamp(4px, 1vmin, 10px);
    text-align: center;
    font-size: clamp(14px, 3vmin, 22px);
    width: 100%;
    color: #ffffff;
  }
  #calGrid div { padding: clamp(2px, 0.6vh, 7px) 0; border-radius: 6px; }
  .dow { font-size: clamp(11px, 2.4vmin, 17px); letter-spacing: 0.5px; color: #8a8a86; font-weight: 600; }
  .today { background: #d0102a; color: #ffffff; font-weight: 600; }

  /* Filera d'instruments: temperatura, altitud, humitat, localitzacio */
  .instruments {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(6px, 1.4vmin, 10px) clamp(10px, 2.4vmin, 18px);
    margin-top: 2px;
  }
  .instrument {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 52px;
  }
  .instLabel {
    font-size: clamp(8px, 1.6vmin, 10px);
    letter-spacing: 1px;
    color: #8a8a86;
    font-weight: 600;
    text-transform: uppercase;
  }
  .instValue {
    font-size: clamp(11px, 2.1vmin, 14px);
    font-weight: 600;
    color: #ffffff;
    margin-top: 2px;
  }

  /* Mobil en horitzontal: rellotge i calendari en linia, encara que l'amplada sigui inferior a 640px */
  @media (orientation: landscape) and (max-height: 500px) {
    body {
      padding: clamp(0.25rem, 1.2vh, 0.75rem) clamp(0.5rem, 2vw, 1rem);
    }
    .wrap {
      flex-direction: row;
      align-items: center;
      justify-content: center;
      width: auto;
      max-width: min(96vw, 820px);
      gap: clamp(0.75rem, 3vw, 2rem);
    }
    .col {
      width: auto;
      gap: clamp(4px, 1vh, 8px);
    }
    #calGrid { min-width: clamp(170px, 30vw, 250px); }
    #clock {
      width: clamp(120px, 44vh, 250px);
      height: clamp(120px, 44vh, 250px);
    }
    #calHeader { font-size: clamp(15px, 3.4vh, 21px); margin-bottom: clamp(3px, 0.8vh, 7px); }
    #calGrid { font-size: clamp(11px, 2.6vh, 15px); gap: clamp(2px, 0.6vh, 5px); }
    #calGrid div { padding: clamp(1px, 0.35vh, 3px) 0; }
    .dow { font-size: clamp(8px, 1.9vh, 11px); }
    .instruments { gap: clamp(3px, 0.8vh, 6px) clamp(6px, 1.8vw, 12px); margin-top: 0; }
    .instLabel { font-size: clamp(7px, 1.3vh, 9px); }
    .instValue { font-size: clamp(9px, 1.7vh, 12px); }
  }

  /* En pantalles mes amples (tauleta/escriptori estret), rellotge i calendari en linia */
  @media (min-width: 640px) {
    .wrap {
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      max-width: 860px;
      gap: clamp(1.5rem, 4vw, 3.5rem);
    }
    .col { width: auto; }
    #calGrid { min-width: 300px; }
  }

  /* En pantalles grans d'escriptori, tot el conjunt creix */
  @media (min-width: 1100px) and (min-height: 700px) {
    .wrap {
      max-width: min(92vw, 1600px);
      gap: clamp(3rem, 6vw, 8rem);
    }
    #clock {
      width: clamp(320px, 34vmin, 620px);
      height: clamp(320px, 34vmin, 620px);
    }
    #calHeader { font-size: clamp(26px, 3.2vmin, 42px); margin-bottom: clamp(16px, 2vmin, 26px); }
    #calGrid { font-size: clamp(18px, 2.6vmin, 32px); gap: clamp(8px, 1.2vmin, 16px); min-width: clamp(360px, 32vw, 620px); }
    .dow { font-size: clamp(14px, 2vmin, 23px); }
    .instLabel { font-size: clamp(11px, 1.2vmin, 14px); }
    .instValue { font-size: clamp(15px, 1.8vmin, 20px); }
    .instruments { gap: clamp(12px, 1.6vmin, 18px) clamp(20px, 2.6vmin, 32px); }
  }

  .sound-hint {
    position: fixed;
    left: 50%;
    bottom: clamp(10px, 3vh, 24px);
    transform: translateX(-50%);
    background: rgba(0,0,0,0.72);
    color: #fff;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: clamp(11px, 1.6vmin, 13px);
    letter-spacing: 0.3px;
    padding: 8px 18px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 50;
  }
  .sound-hint.visible { opacity: 1; }
</style>
</head>

    var len = isHour ? 20 : 8;
    var x1 = 100 + r1 * Math.sin(angle), y1 = 100 - r1 * Math.cos(angle);

      if (d === today) cell.className = 'today';

    }

          instHum.textContent = Math.round(data.current.relative_humidity_2m) + '%';

      })

  }

        if (data && data.elevation && data.elevation.length) {
          instAlt.textContent = Math.round(data.elevation[0]) + ' m';
        }
      })
      .catch(function(){});
  }

  function fetchLocationName(lat, lon) {
    fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lon + '&localityLanguage=ca')
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data) {
          var name = data.locality || data.city || data.principalSubdivision || data.countryName || '--';
          instLoc.textContent = name;
        }
      })
      .catch(function(){});
  }

  function refreshAll(lat, lon) {
    fetchWeather(lat, lon);
    fetchElevation(lat, lon);
    fetchLocationName(lat, lon);
  }

  function requestLocationAndData() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      function(pos){
        lastCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        /* Si el dispositiu proporciona altitud GPS real (mòbils amb GPS), la fem servir en lloc de l'elevació del terreny */
        if (pos.coords.altitude !== null && pos.coords.altitude !== undefined && !isNaN(pos.coords.altitude)) {
          instAlt.textContent = Math.round(pos.coords.altitude) + ' m';
        } else {
          fetchElevation(lastCoords.lat, lastCoords.lon);
        }
        fetchWeather(lastCoords.lat, lastCoords.lon);
        fetchLocationName(lastCoords.lat, lastCoords.lon);
      },
      function(){ /* permís denegat o error: es mantenen els guions */ },
      { timeout: 10000, maximumAge: 600000 }
    );
  }


  /* ---- Rellotge de cucut: gir horari amb cants sincronitzats ---- */
  var clockFlip = document.getElementById('clockFlip');
  var cuckooAudio = document.getElementById('cuckooAudio');

  /* El gir en 3D nomes te dues cares (davant i darrere) separades per
     l'eix Z; vistes de cantell (a mig gir) deixaven un buit transparent
     entre elles. Ho arreglem apilant moltes capes negres intermedies
     que omplen tot el gruix, com les parets d'un cilindre tancat. */
  (function buildClosedCylinder(){
    var depths = [];
    for (var z = -19; z <= 19; z += 2) depths.push(z);
    depths.forEach(function(z){
      var layer = document.createElement('div');
      layer.className = 'clock-edge';
      layer.style.transform = 'translateZ(' + z + 'px)';
      clockFlip.insertBefore(layer, clockFlip.firstChild);
    });
  })();

  /* Motor d'àudio amb Web Audio API: permet encavalcar (crossfade) els
     cants entre si i afegir una catifa sonora de fons contínua, en lloc
     de sentir cada cant com un impacte aïllat envoltat de silenci. */
  var audioCtx = null;
  function obtenirAudioCtx() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { return null; }
    }
    if (audioCtx.state === 'suspended') { audioCtx.resume().catch(function(){}); }
    return audioCtx;
  }

  /* Instants d'inici (en segons) de cada cant dins l'arxiu d'àudio,
     detectats a partir dels silencis entre cants. */
  var CUCKOO_CALLS = [0.44, 1.55, 2.37, 3.20, 3.99, 4.79, 5.60, 6.40, 7.20, 7.97, 8.79];
  var CALL_DUR = 0.80;   /* durada (s) de cada cant reproduït des del buffer */
  var CALL_STEP = 0.62;  /* separacio (s) entre l'inici de cada cant */
  var FADE_IN = 0.035;   /* esvaïment d'entrada de cada cant (s) */
  var FADE_OUT = 0.24;   /* esvaïment de sortida, es superposa amb el cant seguent (s) */
  var TAIL_MS = Math.round((CALL_DUR - FADE_OUT) * 1000); /* marge final un cop acaba l'ultim cant */

  var cucutBuffer = null;
  var bufferReadyPromise = null;
  function assegurarBufferCucut() {
    var ctx = obtenirAudioCtx();
    if (!ctx) return Promise.resolve(false);
    if (cucutBuffer) return Promise.resolve(true);
    if (bufferReadyPromise) return bufferReadyPromise;
    bufferReadyPromise = fetch(cuckooAudio.currentSrc || cuckooAudio.src)
      .then(function (r) { return r.arrayBuffer(); })
      .then(function (buf) { return ctx.decodeAudioData(buf); })
      .then(function (decoded) { cucutBuffer = decoded; return true; })
      .catch(function (err) {
        console.warn('Rellotge: no s\'ha pogut preparar el so del cucut', err);
        bufferReadyPromise = null;
        return false;
      });
    return bufferReadyPromise;
  }

  /* Reprodueix un sol cant des del buffer, amb esvaïments suaus d'entrada
     i sortida (en lloc d'un tall sec) per evitar qualsevol "clic". */
  function reproduirCant(ctxTime, offsetInicial) {
    var ctx = obtenirAudioCtx();
    if (!ctx || !cucutBuffer) return;
    var src = ctx.createBufferSource();
    src.buffer = cucutBuffer;
    var g = ctx.createGain();
    src.connect(g);
    g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, ctxTime);
    g.gain.linearRampToValueAtTime(1, ctxTime + FADE_IN);
    g.gain.setValueAtTime(1, ctxTime + CALL_DUR - FADE_OUT);
    g.gain.linearRampToValueAtTime(0.0001, ctxTime + CALL_DUR);
    src.start(ctxTime, offsetInicial, CALL_DUR + 0.05);
    src.stop(ctxTime + CALL_DUR + 0.06);
  }

  /* Catifa sonora contínua (soroll filtrat molt suau) que sona per sota
     de tota la sequencia: es el "aire" de fons que uneix els cants entre
     si perque no sonin com impactes aïllats envoltats de silenci. */
  function reproduirCatifaFons(ctxTime, durSec) {
    var ctx = obtenirAudioCtx();
    if (!ctx) return;
    var mostres = Math.max(1, Math.round(ctx.sampleRate * 2));
    var buffer = ctx.createBuffer(1, mostres, ctx.sampleRate);
    var dades = buffer.getChannelData(0);
    var ultim = 0;
    for (var i = 0; i < mostres; i++) {
      var blanc = Math.random() * 2 - 1;
      ultim = (ultim + 0.02 * blanc) / 1.02; /* soroll marro, mes greu i suau que el blanc */
      dades[i] = ultim * 3.2;
    }
    var src = ctx.createBufferSource();
    src.buffer = buffer;
    src.loop = true;
    var filtre = ctx.createBiquadFilter();
    filtre.type = 'lowpass';
    filtre.frequency.value = 900;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, ctxTime);
    g.gain.linearRampToValueAtTime(0.05, ctxTime + 0.2);
    g.gain.setValueAtTime(0.05, ctxTime + Math.max(0.2, durSec - 0.45));
    g.gain.linearRampToValueAtTime(0.0001, ctxTime + durSec);
    src.connect(filtre);
    filtre.connect(g);
    g.connect(ctx.destination);
    src.start(ctxTime);
    src.stop(ctxTime + durSec + 0.05);
  }

  /* "Cloc" mecanic sintetitzat (sense arxiu d'àudio): un breu impacte de
     soroll filtrat (el "clic" del pestell) mes un cop de triangle greu
     (el "clonc" del mecanisme en assentar-se). Marca l'instant exacte en
     que el gir s'atura i l'esfera torna a mirar cap endavant. */
  function reproduirCloc() {
    var ctx = obtenirAudioCtx();
    if (!ctx) return;
    var quan = ctx.currentTime;
    var midaBufer = Math.max(1, Math.floor(ctx.sampleRate * 0.015));
    var buffer = ctx.createBuffer(1, midaBufer, ctx.sampleRate);
    var dades = buffer.getChannelData(0);
    for (var i = 0; i < midaBufer; i++) {
      dades[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / midaBufer, 1.5);
    }
    var src = ctx.createBufferSource();
    src.buffer = buffer;
    var filtre = ctx.createBiquadFilter();
    filtre.type = 'lowpass';
    filtre.frequency.value = 1800;
    var gainClic = ctx.createGain();
    gainClic.gain.value = 0.5;
    src.connect(filtre);
    filtre.connect(gainClic);
    gainClic.connect(ctx.destination);
    src.start(quan);
    src.stop(quan + 0.02);

    var osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, quan);
    osc.frequency.exponentialRampToValueAtTime(60, quan + 0.12);
    var gainThump = ctx.createGain();
    gainThump.gain.setValueAtTime(0.0001, quan);
    gainThump.gain.linearRampToValueAtTime(0.5, quan + 0.008);
    gainThump.gain.exponentialRampToValueAtTime(0.0008, quan + 0.22);
    osc.connect(gainThump);
    gainThump.connect(ctx.destination);
    osc.start(quan);
    osc.stop(quan + 0.25);
  }

  var pendingTestRetry = false;
  var soundHint = document.getElementById('soundHint');
  var soundHintTimer = null;

  /* Cap navegador permet activar so automàticament sense que la persona
     hagi tocat la pàgina abans: no hi ha manera de forçar-ho des del codi.
     Si la prova inicial es queda muda per aquest motiu, ho avisem amb un
     rètol discret que desapareix en tocar la pantalla. */
  function mostrarAvisSo() {
    if (!soundHint) return;
    soundHint.classList.add('visible');
    if (soundHintTimer) clearTimeout(soundHintTimer);
    soundHintTimer = setTimeout(function () {
      soundHint.classList.remove('visible');
    }, 6000);
  }
  function amagarAvisSo() {
    if (!soundHint) return;
    soundHint.classList.remove('visible');
    if (soundHintTimer) { clearTimeout(soundHintTimer); soundHintTimer = null; }
  }

  /* Molts navegadors bloquegen l'àudio si encara no hi ha hagut cap
     interacció de l'usuari amb la pàgina. Aprofitem el primer toc o
     tecla per despertar l'AudioContext, i si la prova dels 5 segons
     s'havia quedat en silenci per aquest motiu, la repetim a l'instant. */
  function unlockAudio() {
    amagarAvisSo();
    var ctx = obtenirAudioCtx();
    assegurarBufferCucut();
    if (ctx && ctx.state === 'suspended') {
      ctx.resume().then(function () {
        if (pendingTestRetry) {
          pendingTestRetry = false;
          spinAndChime(4);
        }
      }).catch(function () {});
    } else if (pendingTestRetry) {
      pendingTestRetry = false;
      spinAndChime(4);
    }
  }
  document.addEventListener('pointerdown', unlockAudio, { once: true });
  document.addEventListener('keydown', unlockAudio, { once: true });

  function chimeSpanSeconds(count) {
    if (count <= 0) return 0;
    return (count - 1) * CALL_STEP + CALL_DUR;
  }

  function playCuckoos(count, isTest) {
    assegurarBufferCucut().then(function (ok) {
      var ctx = obtenirAudioCtx();
      if (!ctx) return;
      if (!ok || ctx.state === 'suspended') {
        if (isTest) { pendingTestRetry = true; mostrarAvisSo(); }
        return;
      }
      var t0 = ctx.currentTime + 0.05;
      var span = chimeSpanSeconds(count);
      reproduirCatifaFons(t0, span + 0.2);
      for (var i = 0; i < count; i++) {
        var offset = CUCKOO_CALLS[i % CUCKOO_CALLS.length];
        reproduirCant(t0 + i * CALL_STEP, offset);
      }
    });
  }

  /* El gir sempre dura 10 segons exactes, independentment de quants
     cucuts toquin (com molt, als 12 cucuts, la sequencia dura ~7,6s,
     de manera que sempre acaba abans que el gir s'aturi). El "cloc"
     final es reprodueix a l'animationend, així que sempre coincideix
     amb el final real del gir, encara que duri 10s fixos. */
  var SPIN_MS = 10000;

  function spinAndChime(count, isTest) {
    if (!clockFlip || clockFlip.classList.contains('girant')) return;
    clockFlip.style.setProperty('--gir-dur', (SPIN_MS / 1000) + 's');
    playCuckoos(count, isTest);
    clockFlip.classList.add('girant');
  }

  clockFlip.addEventListener('animationend', function () {
    clockFlip.classList.remove('girant');
    reproduirCloc();
  });

  /* Toca a cada hora en punt, com un rellotge de cucut real. La pàgina
     només actualitza el rellotge quan la pestanya és visible i activa
     (el navegador pausa requestAnimationFrame en segon pla), així que
     si el mòbil estava bloquejat o la pestanya en segon pla exactament
     a l'hora en punt, es podria perdre l'instant exacte. Per cobrir-ho:
     1) donem un marge de 20 segons en lloc d'exigir el segon 0 exacte,
     2) en recuperar el focus de la pestanya, comprovem si acabem de
     passar una hora en punt sense haver tocat encara. Si el dispositiu
     ha estat inactiu més d'aquest marge (p. ex. tota la nit), aquella
     hora concreta es perd igualment: no hi ha manera d'executar codi
     de pàgina mentre la pestanya està totalment aturada. */
  var lastChimedHourKey = null;
  var MARGE_TOC_S = 20;
  function clauHora(now) {
    return now.getFullYear() + '-' + now.getMonth() + '-' + now.getDate() + '-' + now.getHours();
  }
  function comptaCucuts(hh) {
    var count = hh % 12;
    return count === 0 ? 12 : count;
  }
  function checkHourlyChime(now) {
    var hh = now.getHours();
    var key = clauHora(now);
    if (now.getMinutes() === 0 && now.getSeconds() < MARGE_TOC_S && lastChimedHourKey !== key) {
      lastChimedHourKey = key;
      spinAndChime(comptaCucuts(hh));
    }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') checkHourlyChime(new Date());
  });

  /* Prova: als 5 segons d'obrir la pàgina, gira i toca 4 cucuts, per
     comprovar que el gir i el so van sincronitzats. Alguns navegadors
     bloquegen l'àudio automàtic sense interacció prèvia: si no se sent
     res, apareix l'avís de tocar la pantalla. */
  setTimeout(function(){
    spinAndChime(4, true);
  }, 5000);

  requestLocationAndData();
  setInterval(function(){
    if (lastCoords) refreshAll(lastCoords.lat, lastCoords.lon);
    else requestLocationAndData();
  }, 15 * 60 * 1000);
})();
</script>

</body>
