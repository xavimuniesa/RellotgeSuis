<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Domaine</title>
<meta name="description" content="Rellotge d'estació suïssa amb calendari, festius de Catalunya i dades meteorològiques.">
<!-- App instal·lable (PWA) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" id="metaThemeColor" content="#000000">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Domaine">
<script>
(function(){
  /* Tema inicial abans de pintar res: zzz de 23 h a 7 h; de dia clar entre sortida i posta
     de sol (desades de l'última visita, o 7 h-20 h si no se saben); de nit fosc.
     Una tria manual dura fins al següent canvi automàtic. */
  try {
    var ara = new Date();
    var manual = localStorage.getItem('domaineTemaManual');
    var fins = parseInt(localStorage.getItem('domaineTemaManualFins'), 10);
    if (!fins || Date.now() >= fins) manual = null;
    var tema = manual;
    if (tema !== 'clar' && tema !== 'fosc' && tema !== 'zzz') {
      var h = ara.getHours(), min = h * 60 + ara.getMinutes();
      var sortida = parseInt(localStorage.getItem('domaineSortidaMin'), 10);
      var posta = parseInt(localStorage.getItem('domainePostaMin'), 10);
      if (isNaN(sortida)) sortida = 420;
      if (isNaN(posta)) posta = 1200;
      if (h >= 23 || h < 7) tema = 'zzz';
      else tema = (min >= sortida && min < posta) ? 'clar' : 'fosc';
    }
    document.documentElement.setAttribute('data-theme', tema === 'clar' ? 'light' : (tema === 'zzz' ? 'zzz' : 'dark'));
    document.getElementById('metaThemeColor').setAttribute('content', tema === 'clar' ? '#f4f2ec' : '#000000');
  } catch (e) {}
})();
</script>
<style>
  :root {
    --bg: #000000;
    --ombra-caixa: rgba(0,0,0,0.25);
    --color-calhead: #ffffff;
    --color-calgrid: #ffffff;
    --color-dow: #8a8a86;
    --color-instlabel: #8a8a86;
    --color-instvalue: #ffffff;
    --ctrl-fons: rgba(255,255,255,0.14);
    --ctrl-vora: rgba(255,255,255,0.42);
    --ctrl-icona: #ffffff;
    --color-weekend: #ffffff;
    --bg-weekend: #333333;
    --color-festiu: #ffffff;
    --bg-festiu: #d0102a;
    --panel-fons: rgba(255,255,255,0.06);
    --panel-vora: rgba(255,255,255,0.14);
    --accent: #d0102a;
    --accent-text: #ffffff;
    --boto-ple: #ffffff;
    --boto-ple-text: #000000;
  }
  html[data-theme="light"] {
    --bg: #f4f2ec;
    --ombra-caixa: rgba(0,0,0,0.18);
    --color-calhead: #1c1c1c;
    --color-calgrid: #1c1c1c;
    --color-dow: #9a9a94;
    --color-instlabel: #9a9a94;
    --color-instvalue: #1c1c1c;
    --ctrl-fons: rgba(0,0,0,0.08);
    --ctrl-vora: rgba(0,0,0,0.30);
    --ctrl-icona: #1c1c1c;
    --color-weekend: #ffffff;
    --bg-weekend: #6a6a68;
    --color-festiu: #ffffff;
    --bg-festiu: #d0102a;
    --panel-fons: rgba(0,0,0,0.045);
    --panel-vora: rgba(0,0,0,0.11);
    --boto-ple: #1c1c1c;
    --boto-ple-text: #ffffff;
  }
  /* Mode zzz: negre i taronja vermellós, com la pantalla de l'iPhone en repòs a la nit */
  html[data-theme="zzz"] {
    --zzz: #ff4a1c;
    --zzz-mig: #b8360f;
    --zzz-dim: #7a250c;
    --zzz-fosc: #240a04;
    --bg: #000000;
    --ombra-caixa: transparent;
    --color-calhead: var(--zzz);
    --color-calgrid: var(--zzz);
    --color-dow: var(--zzz-dim);
    --color-instlabel: var(--zzz-dim);
    --color-instvalue: var(--zzz);
    --ctrl-fons: rgba(255,74,28,0.07);
    --ctrl-vora: rgba(255,74,28,0.40);
    --ctrl-icona: var(--zzz);
    --color-weekend: var(--zzz);
    --bg-weekend: var(--zzz-fosc);
    --color-festiu: #000000;
    --bg-festiu: var(--zzz-mig);
    --panel-fons: rgba(255,74,28,0.06);
    --panel-vora: rgba(255,74,28,0.24);
    --accent: var(--zzz-mig);
    --accent-text: #000000;
    --boto-ple: var(--zzz);
    --boto-ple-text: #000000;
  }
  html[data-theme="zzz"] .clock-case,
  html[data-theme="zzz"] .clock-edge,
  html[data-theme="zzz"] .clock-face-back { background: #000; }
  html[data-theme="zzz"] .clock-case { box-shadow: 0 0 0 1.5px var(--zzz-dim); }
  html[data-theme="zzz"] .clock-back-plate { background: radial-gradient(circle at 40% 35%, #1c0803 0%, #000 75%); box-shadow: none; }
  html[data-theme="zzz"] .back-flag rect:first-child { fill: var(--zzz-mig); }
  html[data-theme="zzz"] .back-flag rect + rect { fill: #000; }
  html[data-theme="zzz"] #clock [filter] { filter: none; }
  html[data-theme="zzz"] #dialFace { fill: #000; stroke: var(--zzz-dim); }
  html[data-theme="zzz"] #dialBezel,
  html[data-theme="zzz"] #dialGlass { display: none; }
  html[data-theme="zzz"] #ticks line { stroke: var(--zzz); }
  html[data-theme="zzz"] #hourHand,
  html[data-theme="zzz"] #minHand,
  html[data-theme="zzz"] #centreCap { fill: var(--zzz); }
  html[data-theme="zzz"] #secGroup line { stroke: var(--zzz-mig); }
  html[data-theme="zzz"] #secGroup circle { fill: var(--zzz-mig); }
  html[data-theme="zzz"] #brandText,
  html[data-theme="zzz"] #brandLogo text,
  html[data-theme="zzz"] #republicaText { fill: var(--zzz); }
  html[data-theme="zzz"] #brandLogo rect { fill: var(--zzz-mig); }
  html[data-theme="zzz"] #brandLogo polygon { fill: #000; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    transition: background-color 0.6s ease;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(0.5rem, 2vh, 1.5rem) clamp(0.75rem, 3vw, 1.5rem);
    padding-top: max(clamp(0.5rem, 2vh, 1.5rem), env(safe-area-inset-top));
    padding-bottom: max(clamp(0.5rem, 2vh, 1.5rem), env(safe-area-inset-bottom));
    padding-left: max(clamp(0.75rem, 3vw, 1.5rem), env(safe-area-inset-left));
    padding-right: max(clamp(0.75rem, 3vw, 1.5rem), env(safe-area-inset-right));
    box-sizing: border-box;
    min-height: 100dvh;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(0.6rem, 2vh, 1.25rem);
    width: 100%;
    max-width: 420px;
  }
  .col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 1.6vh, 14px);
    width: 100%;
  }


  .clock-case {
    background: linear-gradient(135deg, #3a3a3a 0%, #1c1c1c 45%, #0a0a0a 100%);
    border-radius: 50%;
    padding: clamp(4px, 0.8vmin, 7px);
    box-shadow: 0 6px 20px var(--ombra-caixa);
  }

  /* Mecanisme de gir horari: cara davantera (esfera) i cara posterior
     (placa platejada amb la bandera suïssa), amb una capa negra intermitja
     que evita que es vegi transparent pel lateral durant el gir. */
  .clock-flip-wrap {
    perspective: 1800px;
  }
  .clock-flip {
    position: relative;
    display: inline-block;
    transform-style: preserve-3d;
  }
  .clock-flip.girant {
    animation: girRellotge var(--gir-dur, 10s) cubic-bezier(.45,.05,.55,.95);
  }
  @keyframes girRellotge {
    from { transform: rotateY(0deg); }
    to   { transform: rotateY(360deg); }
  }
  .clock-edge {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, #3a3a3a 0%, #1c1c1c 45%, #0a0a0a 100%);
  }
  .clock-face-front {
    position: relative;
    transform: translateZ(20px);
    backface-visibility: hidden;
  }
  .clock-face-back {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    transform: rotateY(180deg) translateZ(20px);
    backface-visibility: hidden;
    background: linear-gradient(135deg, #3a3a3a 0%, #1c1c1c 45%, #0a0a0a 100%);
    padding: clamp(4px, 0.8vmin, 7px);
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .clock-back-plate {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f6f7f8 0%, #dde1e4 24%, #b4bac0 50%, #7d838a 76%, #45474b 100%);
    box-shadow: inset 0 0 26px rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .back-flag {
    width: 50%;
    height: 50%;
    display: block;
  }
  #clock {
    width: clamp(170px, 66vmin, 360px);
    height: clamp(170px, 66vmin, 360px);
    display: block;
  }
  .cal-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: clamp(6px, 1.5vw, 16px);
    margin-bottom: clamp(6px, 1vh, 14px);
  }
  #calHeader {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(4px, 1vw, 10px);
    text-align: center;
    font-size: clamp(19px, 4vmin, 30px);
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--color-calhead);
  }
  #calHeaderText { text-transform: capitalize; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .avui-btn {
    flex: none;
    width: clamp(16px, 2.6vmin, 22px);
    height: clamp(16px, 2.6vmin, 22px);
    border: none;
    background: transparent;
    color: var(--color-dow);
    padding: 0;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .avui-btn.visible { display: flex; }
  .avui-btn svg { width: 100%; height: 100%; }
  .avui-btn:active { transform: scale(0.88); }
  #calGrid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: clamp(4px, 1vmin, 10px);
    text-align: center;
    font-size: clamp(14px, 3vmin, 22px);
    width: 100%;
    color: var(--color-calgrid);
    touch-action: none;
    user-select: none;
  }
  #calGrid div { padding: clamp(2px, 0.6vh, 7px) 0; border-radius: 6px; }
  .dow { font-size: clamp(11px, 2.4vmin, 17px); letter-spacing: 0.5px; color: var(--color-dow); font-weight: 600; }
  /* Prioritat visual (ordre de la cascada): cap de setmana < festiu (estatal, autonomic o local, tots igual).
     "avui" es un anell, no un fons, per no amagar mai de quin tipus de dia es tracta. */
  .weekend { background: var(--bg-weekend); color: var(--color-weekend); font-weight: 600; }
  .festiu { background: var(--bg-festiu); color: var(--color-festiu); font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .today { box-shadow: 0 0 0 2px var(--color-calhead) inset; font-weight: 800; }


  /* ---- Finestres d'informació: lliscant el calendari cap avall ---- */
  .col-calendari {
    position: relative;
    overflow: hidden;
    padding: 10px;
    margin: -10px;
  }
  .vista-calendari {
    display: flex;
    flex-direction: column;
    touch-action: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .col-calendari.obert .vista-calendari { opacity: 0; transform: translateY(22px); pointer-events: none; }
  .mes-dades-fila {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: clamp(4px, 1vh, 10px);
    min-height: 26px;
  }
  .mes-dades {
    border: none;
    background: transparent;
    color: var(--color-dow);
    padding: 2px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
  }
  .mes-dades svg { width: 22px; height: 14px; }
  .mes-dades:active { transform: translateY(2px); }
  .ara-sona {
    display: none;
    align-items: center;
    gap: 6px;
    max-width: 70%;
    border: 1px solid var(--panel-vora);
    background: var(--panel-fons);
    color: var(--color-calgrid);
    border-radius: 999px;
    padding: 3px 10px 3px 4px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .ara-sona.visible { display: inline-flex; }
  .ara-sona .ic { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; flex: none; }
  .ara-sona .ic svg { width: 9px; height: 9px; }
  .ara-sona .tx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .finestres {
    position: absolute;
    inset: 10px;
    container-type: inline-size;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(calc(-100% - 24px));
    transition: transform 0.45s cubic-bezier(.2,.8,.2,1), opacity 0.3s ease;
    overflow: hidden;
    pointer-events: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    color: var(--color-calgrid);
    font-size: clamp(12px, 3.4cqw, 15.5px);
  }
  .col-calendari.obert .finestres { opacity: 1; transform: none; pointer-events: auto; }
  .fin-cap {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: clamp(6px, 1.4cqw, 12px);
  }
  .fin-punts { display: flex; align-items: center; gap: 7px; }
  .fin-punt {
    width: 7px; height: 7px; padding: 0; border: none; border-radius: 4px;
    background: var(--panel-vora);
    cursor: pointer;
    transition: width 0.25s ease, background 0.25s ease;
  }
  .fin-punt.actiu { width: 22px; background: var(--color-calhead); }
  .fin-tanca { width: 30px; height: 30px; box-shadow: none; }
  .fin-tanca svg { width: 60%; height: 60%; }
  .fin-pista {
    flex: 1;
    min-height: 0;
    display: flex;
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1);
  }
  .finestra {
    flex: 0 0 100%;
    min-width: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: 0 1px;
  }
  .fin-titol {
    flex: none;
    margin: 0 0 clamp(6px, 2cqw, 12px);
    font-size: clamp(17px, 5.4cqw, 28px);
    font-weight: 700;
    letter-spacing: 0.3px;
    color: var(--color-calhead);
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .fin-titol small {
    font-size: 0.5em;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--color-dow);
  }
  .fin-cos {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: none;
  }
  .fin-cos::-webkit-scrollbar { display: none; }
  .fin-cos.scrollable { touch-action: pan-y; }
  /* Difuminat inferior quan hi ha més contingut a sota */
  .fin-cos.scrollable:not(.al-final) {
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent);
            mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent);
  }

  .dada-gran {
    font-size: clamp(30px, 11cqw, 66px);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.5px;
    color: var(--color-calhead);
    overflow-wrap: anywhere;
  }
  .dada-sub { color: var(--color-dow); font-weight: 600; margin-top: 4px; font-size: 0.95em; }
  .dades-graella {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(6px, 2cqw, 12px);
    margin-top: clamp(10px, 4cqw, 22px);
  }
  .dada {
    border: 1px solid var(--panel-vora);
    background: var(--panel-fons);
    border-radius: 14px;
    padding: clamp(8px, 2.6cqw, 14px) clamp(8px, 2.6cqw, 14px);
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .dada .v { font-size: clamp(15px, 4.8cqw, 28px); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dada .e { font-size: 0.72em; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--color-dow); }
  .alertes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: clamp(10px, 3.4cqw, 18px); }
  .alerta-xip {
    display: inline-flex; align-items: center; gap: 7px;
    border-radius: 999px;
    padding: 6px 12px 6px 8px;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 700;
    font-size: 0.92em;
  }
  .alerta-xip svg { width: 16px; height: 16px; flex: none; }
  .alerta-xip small { font-weight: 600; opacity: 0.85; }
  .sense-alertes { color: var(--color-dow); font-weight: 600; }
  .peu-dades { margin-top: 10px; font-size: 0.72em; color: var(--color-dow); }

  .seccio-prog { font-size: 0.72em; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--color-dow); margin: clamp(8px, 2.6cqw, 14px) 0 6px; }
  .llista-prog { display: flex; flex-direction: column; gap: clamp(5px, 1.4cqw, 8px); }
  .via-fila { display: flex; align-items: center; gap: clamp(8px, 2.4cqw, 14px); margin-top: clamp(8px, 2.2cqw, 12px); }
  .via-etiqueta { flex: none; display: flex; flex-direction: column; font-size: 0.72em; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: var(--color-dow); line-height: 1.2; }
  .via-etiqueta small { font-size: 1em; font-weight: 700; }
  .via-lliure { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; gap: clamp(5px, 1.4cqw, 8px); }
  .prog-fila { display: flex; align-items: stretch; gap: 6px; min-width: 0; }
  .prog {
    position: relative;
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: clamp(8px, 2.4cqw, 12px);
    padding: clamp(5px, 1.4cqw, 8px) clamp(8px, 2.4cqw, 12px);
    border-radius: 12px;
    border: 1px solid var(--panel-vora);
    background: var(--panel-fons);
    color: var(--color-calgrid);
    font: inherit;
    text-align: left;
    cursor: pointer;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .prog:active { transform: scale(0.975); }
  .prog-dia { flex: none; width: 5.4em; display: flex; flex-direction: column; line-height: 1.15; }
  .prog-dia b { font-size: 0.8em; letter-spacing: 0.06em; text-transform: uppercase; }
  .prog-dia small { font-size: 0.74em; font-weight: 600; color: var(--color-dow); }
  .via-lliure .prog-dia { width: auto; flex: 1; }
  .prog-titol { flex: 1; min-width: 0; font-size: 0.9em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog-icona {
    flex: none;
    width: clamp(24px, 6cqw, 28px);
    height: clamp(24px, 6cqw, 28px);
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--boto-ple);
    color: var(--boto-ple-text);
  }
  .prog-icona svg { width: 40%; height: 40%; }
  .prog .ic-pausa, .prog.sonant .ic-play { display: none; }
  .prog.sonant .ic-pausa { display: block; }
  .prog-barra { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: currentColor; opacity: 0.55; }
  .prog.darrer { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .prog.darrer .prog-dia small { color: inherit; opacity: 0.8; }
  .prog.darrer .prog-icona { background: var(--accent-text); color: var(--accent); }
  .prog.sonant:not(.darrer) { border-color: var(--color-calgrid); }
  .prog.carregant .prog-icona { animation: polsa 1s ease-in-out infinite; }
  .prog-ext {
    flex: none;
    width: clamp(28px, 7cqw, 36px);
    border-radius: 12px;
    border: 1px solid var(--panel-vora);
    color: var(--color-dow);
    display: grid;
    place-items: center;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .prog-ext svg { width: 14px; height: 14px; }
  .estat-prog { color: var(--color-dow); font-weight: 600; padding: 6px 0; }
  .estat-prog a { color: inherit; }

  .radios { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(6px, 2cqw, 10px); }
  @container (max-width: 330px) { .radios { grid-template-columns: repeat(2, 1fr); } }
  .radio {
    position: relative;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(4px, 1.2cqw, 8px);
    padding: clamp(9px, 2.8cqw, 15px) clamp(9px, 2.6cqw, 14px);
    border-radius: 14px;
    border: 1px solid var(--panel-vora);
    background: var(--panel-fons);
    color: var(--color-calgrid);
    font: inherit;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.12s ease, background 0.2s ease;
  }
  .radio:active { transform: scale(0.97); }
  .radio .nom { font-weight: 800; font-size: clamp(13px, 3.9cqw, 19px); line-height: 1.1; }
  .radio .sub { font-size: 0.68em; font-weight: 700; letter-spacing: 0.7px; text-transform: uppercase; color: var(--color-dow); }
  .radio .estat { display: flex; align-items: center; gap: 6px; font-size: 0.7em; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--color-dow); }
  .radio .punt { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.6; }
  .radio.sonant { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .radio.sonant .sub, .radio.sonant .estat { color: inherit; opacity: 0.9; }
  .radio.sonant .punt { opacity: 1; animation: polsa 1.2s ease-in-out infinite; }
  .radio.carregant .punt { animation: polsa 0.6s ease-in-out infinite; }
  @keyframes polsa { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  /* Finestreta amb el nom del festiu, en tocar la data */
  .festiu-tip {
    position: fixed;
    left: 0;
    top: 0;
    transform: translate(-50%, 10px);
    background: var(--color-calgrid);
    color: var(--bg);
    font-size: clamp(11px, 2.4vmin, 15px);
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 8px;
    max-width: min(80vw, 260px);
    text-align: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 60;
  }
  .festiu-tip.visible { opacity: 1; transform: translate(-50%, 14px); }
  .festiu-tip::before {
    content: '';
    position: absolute;
    left: 50%;
    top: -5px;
    transform: translateX(-50%);
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 6px solid var(--color-calgrid);
  }

  /* Mobil en horitzontal: rellotge i calendari en linia, encara que l'amplada sigui inferior a 640px */
  @media (orientation: landscape) and (max-height: 500px) {
    body {
      padding: clamp(0.25rem, 1.2vh, 0.75rem) clamp(0.5rem, 2vw, 1rem);
      padding-top: max(clamp(0.25rem, 1.2vh, 0.75rem), env(safe-area-inset-top));
      padding-bottom: max(clamp(0.25rem, 1.2vh, 0.75rem), env(safe-area-inset-bottom));
      padding-left: max(clamp(0.5rem, 2vw, 1rem), env(safe-area-inset-left));
      padding-right: max(clamp(0.5rem, 2vw, 1rem), env(safe-area-inset-right));
    }
    .wrap {
      flex-direction: row;
      align-items: center;
      justify-content: center;
      width: auto;
      max-width: min(96vw, 820px);
      gap: clamp(0.75rem, 3vw, 2rem);
    }
    .col {
      width: auto;
      gap: clamp(4px, 1vh, 8px);
    }
    .col-calendari {
      align-self: flex-start;
      height: calc(100dvh - 2 * clamp(0.25rem, 1.2vh, 0.75rem) - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 14px);
    }
    .wrap > .col:first-child { align-self: center; }
    .finestres { font-size: 12px; }
    .fin-cap { margin-bottom: 4px; }
    .fin-titol { font-size: 17px; margin-bottom: 6px; }

    .dada { padding: 6px 8px; border-radius: 11px; }

    .alertes { margin-top: 8px; gap: 6px; }
    .radio { padding: 8px; gap: 3px; }
    #calGrid { min-width: clamp(170px, 30vw, 250px); }
    #clock {
      width: clamp(150px, 66vh, 360px);
      height: clamp(150px, 66vh, 360px);
    }
    #calHeader { font-size: clamp(15px, 3.4vh, 21px); }
    #calGrid { font-size: clamp(11px, 2.6vh, 15px); gap: clamp(2px, 0.6vh, 5px); }
    #calGrid div { padding: clamp(1px, 0.35vh, 3px) 0; }
    .dow { font-size: clamp(8px, 1.9vh, 11px); }
  }

  /* En pantalles mes amples (tauleta/escriptori estret), rellotge i calendari en linia */
  @media (min-width: 640px) {
    .wrap {
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      max-width: min(96vw, 1000px);
      gap: clamp(1.5rem, 4vw, 3.5rem);
    }
    .col { width: auto; }
    #calGrid { min-width: clamp(300px, 40vw, 380px); }
    #clock {
      width: clamp(220px, 52vmin, 540px);
      height: clamp(220px, 52vmin, 540px);
    }
  }

  /* En pantalles grans d'escriptori, tot el conjunt creix */
  @media (min-width: 1100px) and (min-height: 700px) {
    .wrap {
      max-width: min(96vw, 2000px);
      gap: clamp(2rem, 5vw, 6rem);
    }
    #clock {
      width: clamp(380px, 68vmin, 920px);

    }
    .cal-header-row { margin-bottom: clamp(16px, 2vmin, 26px); }
    #calHeader { font-size: clamp(28px, 4vmin, 52px); }
    #calGrid { font-size: clamp(20px, 3.4vmin, 42px); gap: clamp(8px, 1.5vmin, 20px); min-width: clamp(420px, 38vw, 800px); }

  .sound-hint {
    position: fixed;
    left: 50%;
    bottom: clamp(10px, 3vh, 24px);
    transform: translateX(-50%);
    background: rgba(0,0,0,0.72);
    color: #fff;

    font-size: clamp(11px, 1.6vmin, 13px);

    opacity: 0;

  }
  .sound-hint.visible { opacity: 1; }

  /* Botons: ara flanquegen el nom del mes dins del calendari, en lloc d'anar sobre el rellotge,
     per no robar-li alçada disponible. */
  .ctrl-btn {
    flex: none;
    width: clamp(30px, 5.6vmin, 42px);

  .ctrl-btn:active { transform: scale(0.90); }

  /* Mobil en horitzontal: botons mes discrets perque no hipotequin pantalla */

    .cal-header-row { gap: clamp(4px, 1.2vw, 10px); margin-bottom: clamp(2px, 0.6vh, 5px); }

    .ctrl-btn { width: clamp(34px, 3.4vmin, 50px); height: clamp(34px, 3.4vmin, 50px); }
  }
</style>

<script>
(function(){
  var svgNS = "http://www.w3.org/2000/svg";
  var ticks = document.getElementById('ticks');
  for (var i = 0; i < 60; i++) {
    var angle = i * 6 * Math.PI / 180;
    var isHour = i % 5 === 0;
    var r1 = isHour ? 72 : 84;
    var w = isHour ? 6 : 3;
    var len = isHour ? 20 : 8;
    var x1 = 100 + r1 * Math.sin(angle), y1 = 100 - r1 * Math.cos(angle);
    var x2 = 100 + (r1 + len) * Math.sin(angle), y2 = 100 - (r1 + len) * Math.cos(angle);
    var line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', '#1c1c1c');
    line.setAttribute('stroke-width', w);
    ticks.appendChild(line);
  }

  var diesSetmana = ["dl","dt","dc","dj","dv","ds","dg"];
  var diesLlarg = ["diumenge","dilluns","dimarts","dimecres","dijous","divendres","dissabte"];
  var mesos = ["gener","febrer","març","abril","maig","juny","juliol","agost","setembre","octubre","novembre","desembre"];

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  /* Festius: dades obertes de la Generalitat de Catalunya (analisi.transparenciacatalunya.cat).
     "Festius generals de Catalunya" dona el nom de cada festiu estatal i autonomic (camp
     nom_del_festiu); "Calendari de festes locals a Catalunya" filtrat per Barcelona dona els
     festius locals (sense nom especific, nomes la marca "Festiu local"). Es consulten
     periodicament perque l'administracio pot actualitzar-los (p.ex. en fixar-se els festius
     locals de l'any vinent). Es guarda el nom de cada festiu per mostrar-lo en tocar la data. */
  var FESTIUS_BASE = 'https://analisi.transparenciacatalunya.cat/resource/';
  var nomFestius = {};
  var anysFestiusCarregats = {};

  /* Alguns festius de data fixa desapareixen del calendari laboral oficial quan cauen en
     diumenge (ja es festiu de per si, no genera dia inhabil extra), tot i que la festa
     existeix igualment (p.ex. Tots Sants 2026, que cau en diumenge). Els garantim aqui com
     a reforç, sense sobreescriure mai el nom que arribi de l'administracio. */
  var FESTIUS_FIXOS = {
    '01-01': "Cap d'Any",
    '01-06': 'Reis',
    '05-01': 'Festa del Treball',
    '06-24': 'Sant Joan',
    '08-15': "L'Assumpció",
    '09-11': 'Diada Nacional de Catalunya',
    '10-01': "Dia de la República",
    '10-12': "Festa Nacional d'Espanya",
    '11-01': 'Tots Sants',
    '12-06': 'Dia de la Constitució',
    '12-08': 'La Immaculada',
    '12-25': 'Nadal',
    '12-26': 'Sant Esteve'
  };

  function aplicaFestiusFixos(any) {
    Object.keys(FESTIUS_FIXOS).forEach(function(md){
      var key = any + '-' + md;
      if (!nomFestius[key]) nomFestius[key] = FESTIUS_FIXOS[md];
    });
  }

  function dataToKey(dataIso) { return dataIso.slice(0, 10); }

  function fetchFestius(any) {
    fetch(FESTIUS_BASE + '8qnu-agns.json?$limit=100&any=' + any)
      .then(function(r){ return r.json(); })
      .then(function(files){
        files.forEach(function(row){
          if (row.data && row.nom_del_festiu) nomFestius[dataToKey(row.data)] = row.nom_del_festiu;
        });
        buildCalendar(new Date());
      })
      .catch(function(){});

    fetch(FESTIUS_BASE + 'b4eh-r8up.json?$limit=20&any_calendari=' + any + '&ajuntament_o_nucli_municipal=Barcelona')
      .then(function(r){ return r.json(); })
      .then(function(files){
        files.forEach(function(row){
          if (row.data) {
            var key = dataToKey(row.data);
            if (!nomFestius[key]) nomFestius[key] = 'Festa local (Barcelona)';
          }
        });
        buildCalendar(new Date());
      })
      .catch(function(){});
  }

  /* Demana els festius d'un any nomes la primera vegada que cal mostrar-lo (en navegar pel calendari) */
  function assegurarFestius(any) {
    aplicaFestiusFixos(any);
    if (!anysFestiusCarregats[any]) {
      anysFestiusCarregats[any] = true;
      fetchFestius(any);
    }
  }

  assegurarFestius(new Date().getFullYear());
  /* Recomprovem periodicament (cada 12h) tots els anys ja carregats, per si l'administracio actualitza el calendari */
  setInterval(function(){
    Object.keys(anysFestiusCarregats).forEach(function(any){ fetchFestius(parseInt(any, 10)); });
  }, 12 * 60 * 60 * 1000);

  var festiuTipEl = document.getElementById('festiuTip');
  var festiuTipCella = null;

  function amagaFestiuTip() {
    festiuTipEl.classList.remove('visible');
    festiuTipCella = null;
  }

  function mostraFestiuTip(cell) {
    festiuTipEl.textContent = cell.dataset.festiuNom;
    var r = cell.getBoundingClientRect();
    festiuTipEl.style.left = (r.left + r.width / 2) + 'px';
    festiuTipEl.style.top = r.bottom + 'px';
    festiuTipEl.classList.add('visible');
    festiuTipCella = cell;
  }

  document.addEventListener('scroll', amagaFestiuTip, true);
  window.addEventListener('resize', amagaFestiuTip);

  /* Desplaçament (en mesos) respecte al mes real, controlat en lliscar el calendari.
     Sense limit en cap sentit. */
  var mesOffset = 0;

  function buildCalendar(realNow) {
    amagaFestiuTip();
    var todayKey = realNow.getFullYear() + '-' + pad2(realNow.getMonth() + 1) + '-' + pad2(realNow.getDate());
    var view = new Date(realNow.getFullYear(), realNow.getMonth() + mesOffset, 1);
    var year = view.getFullYear(), month = view.getMonth();
    assegurarFestius(year);
    document.getElementById('calHeaderText').textContent = mesos[month] + " " + year;
    document.getElementById('avuiBtn').classList.toggle('visible', mesOffset !== 0);
    var grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    diesSetmana.forEach(function(d){
      var el = document.createElement('div');
      el.textContent = d;
      el.className = 'dow';
      grid.appendChild(el);
    });
    var firstDay = (new Date(year, month, 1).getDay() + 6) % 7;
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    for (var i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));
    for (var d = 1; d <= daysInMonth; d++) {
      var cell = document.createElement('div');
      cell.textContent = d;
      var key = year + '-' + pad2(month + 1) + '-' + pad2(d);
      var dow = new Date(year, month, d).getDay();
      var classes = [];
      if (dow === 0 || dow === 6) classes.push('weekend');
      var nom = nomFestius[key];
      if (nom) {
        classes.push('festiu');
        cell.dataset.festiuNom = nom;
        cell.addEventListener('click', function(ev){
          if (festiuTipCella === ev.currentTarget) { amagaFestiuTip(); }
          else { mostraFestiuTip(ev.currentTarget); }
        });
      }
      if (key === todayKey) classes.push('today');
      cell.className = classes.join(' ');
      grid.appendChild(cell);
    }
    /* Reserva sempre 6 files de setmana (42 caselles): així el calendari fa la mateixa
       alçada tant si el mes en té 4, 5 o 6, i el rellotge no es mou en canviar de mes. */
    var totalCaselles = 7 + 42;
    while (grid.children.length < totalCaselles) {
      var buida = document.createElement('div');
      buida.className = 'buida';
      buida.innerHTML = '&nbsp;';
      grid.appendChild(buida);
    }
  }

  /* Anima el canvi de mes (lliscament visual) i torna a construir el calendari */
  function animaICanvia(direccioSigne) {
    var grid = document.getElementById('calGrid');
    grid.style.transition = 'none';
    grid.style.transform = 'translateX(' + (direccioSigne > 0 ? '16px' : '-16px') + ')';
    grid.style.opacity = '0.25';
    buildCalendar(new Date());
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        grid.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
        grid.style.transform = 'translateX(0)';
        grid.style.opacity = '1';
      });
    });
  }

  /* Lliscar el calendari a dreta o esquerra: sense limit de mesos */
  function canviaMes(delta) {
    mesOffset += delta;
    animaICanvia(delta);
  }

  /* Tornar directament al mes actual: boto "avui" o doble toc al nom del mes */
  function tornaMesActual() {
    if (mesOffset === 0) return;
    var direccio = mesOffset > 0 ? -1 : 1;
    mesOffset = 0;
    animaICanvia(direccio);
  }

  /* Evita que un lliscament acabi activant un clic (festiu, enllaç o botó) */
  var ignoraClicFins = 0;
  function suprimeixClic() { ignoraClicFins = Date.now() + 400; }
  document.addEventListener('click', function(e){
    if (Date.now() < ignoraClicFins) { e.preventDefault(); e.stopPropagation(); }
  }, true);

  /* Calendari: lliscar a dreta o esquerra canvia de mes; lliscar cap avall obre les finestres */
  (function initGestosCalendari(){
    var vista = document.getElementById('vistaCalendari');
    var x0 = 0, y0 = 0, t0 = 0, actiu = false;
    vista.addEventListener('pointerdown', function(e){
      if (e.button > 0) return;
      x0 = e.clientX; y0 = e.clientY; t0 = Date.now(); actiu = true;
    });
    window.addEventListener('pointerup', function(e){
      if (!actiu) return;
      actiu = false;
      var dx = e.clientX - x0, dy = e.clientY - y0;
      if (Date.now() - t0 > 900) return;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        canviaMes(dx < 0 ? 1 : -1);
        suprimeixClic();
      } else if (dy > 45 && dy > Math.abs(dx) * 1.3) {
        obreFinestres();
        suprimeixClic();
      }
    });
    window.addEventListener('pointercancel', function(){ actiu = false; });
  })();

  /* Tornar al mes actual: boto dedicat, o doble toc al nom del mes (a qualsevol mes on siguem) */
  document.getElementById('avuiBtn').addEventListener('click', tornaMesActual);
  (function initDobleTocMes(){
    var text = document.getElementById('calHeaderText');
    var ultimToc = 0;
    text.addEventListener('click', function(){
      var ara = Date.now();
      if (ara - ultimToc < 400) { tornaMesActual(); ultimToc = 0; }
      else { ultimToc = ara; }
    });
  })();

  var lastDay = null;
  var lastDigitalSecond = null;

  function frame() {
    var now = new Date();
    var h = now.getHours() % 12, m = now.getMinutes();
    var s = now.getSeconds();
    var ms = now.getMilliseconds();
    var sFrac = s + ms / 1000;

    var sAngle;
    if (sFrac < 58) {
      sAngle = (sFrac / 58) * 360;
    } else {
      sAngle = 360;
    }

    var mAngle = m * 6;
    var hAngle = (h + m / 60) * 30;

    document.getElementById('hourHand').setAttribute('transform', 'rotate(' + hAngle + ' 100 100)');
    document.getElementById('minHand').setAttribute('transform', 'rotate(' + mAngle + ' 100 100)');
    document.getElementById('secGroup').setAttribute('transform', 'rotate(' + sAngle + ' 100 100)');

    if (s !== lastDigitalSecond) {
      lastDigitalSecond = s;
      if (lastDay !== now.getDate()) {
        lastDay = now.getDate();
        buildCalendar(now);
        actualitzaDiaEspecial(now);
      }
      checkHourlyChime(now);
      aplicarTemaAutomatic();
    }

    requestAnimationFrame(frame);
  }

  /* L'1 d'octubre, dia de la República, l'esfera ho mostra a la part baixa */
  function actualitzaDiaEspecial(now) {
    var esDiaEspecial = (now.getMonth() === 9 && now.getDate() === 1);
    document.getElementById('republicaLinia1').textContent = esDiaEspecial ? '1-O' : '';
    document.getElementById('republicaLinia2').textContent = esDiaEspecial ? 'Fem República!' : '';
  }
  actualitzaDiaEspecial(new Date());

  requestAnimationFrame(frame);

  /* ======== Finestres d'informació ========
     Lliscant el calendari cap avall apareixen 4 finestres que es passen lateralment:
     Ubicació · El temps · La Competència / Via lliure · Radiodirecta.
     Lliscant cap amunt (o amb el botó del calendari) es torna al calendari. */
  var dades = {
    poblacio: null, regio: null, lat: null, lon: null, altitud: null,
    temp: null, sensacio: null, humitat: null, vent: null, ratxes: null,
    alertes: [], actualitzat: null
  };
  var lastCoords = null;

  var colCal = document.getElementById('colCalendari');
  var finestresEl = document.getElementById('finestres');
  var finPista = document.getElementById('finPista');
  var finPunts = document.getElementById('finPunts');
  var seccions = finPista.querySelectorAll('.finestra');
  var finIndex = 0;

  for (var fi = 0; fi < seccions.length; fi++) {
    (function(i){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'fin-punt';
      b.setAttribute('aria-label', seccions[i].getAttribute('data-nom'));
      b.addEventListener('click', function(){ vesAFinestra(i); });
      finPunts.appendChild(b);
    })(fi);
  }

  function marcaScrollables() {
    finPista.querySelectorAll('.fin-cos').forEach(function(cos){
      cos.classList.toggle('scrollable', cos.scrollHeight > cos.clientHeight + 2);
      cos.classList.toggle('al-final', cos.scrollTop + cos.clientHeight >= cos.scrollHeight - 4);
    });
  }
  finPista.querySelectorAll('.fin-cos').forEach(function(cos){
    cos.addEventListener('scroll', function(){
      cos.classList.toggle('al-final', cos.scrollTop + cos.clientHeight >= cos.scrollHeight - 4);
    }, { passive: true });
  });
  window.addEventListener('resize', marcaScrollables);

  function finestresObertes() { return colCal.classList.contains('obert'); }

  function vesAFinestra(i) {
    finIndex = Math.max(0, Math.min(seccions.length - 1, i));
    finPista.style.transition = '';
    finPista.style.transform = 'translateX(' + (-finIndex * 100) + '%)';
    var punts = finPunts.children;
    for (var k = 0; k < punts.length; k++) punts[k].classList.toggle('actiu', k === finIndex);
    if (finIndex === 2) carregaProgrames(false);
  }

  function obreFinestres() {
    amagaFestiuTip();
    colCal.classList.add('obert');
    finestresEl.setAttribute('aria-hidden', 'false');
    vesAFinestra(0);
    renderUbicacio();
    renderTemps();
    requestAnimationFrame(marcaScrollables);
  }

  function tancaFinestres() {
    colCal.classList.remove('obert');
    finestresEl.setAttribute('aria-hidden', 'true');
  }

  document.getElementById('mesDades').addEventListener('click', obreFinestres);
  document.getElementById('finTanca').addEventListener('click', tancaFinestres);

  /* Gestos dins les finestres: lateral per passar de finestra (segueix el dit),
     cap amunt per tornar al calendari */
  (function initGestosFinestres(){
    var x0 = 0, y0 = 0, t0 = 0, actiu = false, mode = null, desDeCap = false, cos = null;
    finestresEl.addEventListener('pointerdown', function(e){
      if (e.button > 0) return;
      actiu = true; mode = null;
      x0 = e.clientX; y0 = e.clientY; t0 = Date.now();
      desDeCap = !!e.target.closest('.fin-cap, .fin-titol');
      cos = e.target.closest('.fin-cos');
    });
    window.addEventListener('pointermove', function(e){
      if (!actiu) return;
      var mx = e.clientX - x0, my = e.clientY - y0;
      if (!mode) {
        if (Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my)) mode = 'h';
        else if (Math.abs(my) > 8) mode = 'v';
      }
      if (mode === 'h') {
        var vora = (finIndex === 0 && mx > 0) || (finIndex === seccions.length - 1 && mx < 0);
        var desp = vora ? mx * 0.3 : mx;
        finPista.style.transition = 'none';
        finPista.style.transform = 'translateX(calc(' + (-finIndex * 100) + '% + ' + desp + 'px))';
      }
    });
    window.addEventListener('pointerup', function(e){
      if (!actiu) return;
      actiu = false;
      var mx = e.clientX - x0, my = e.clientY - y0;
      if (mode === 'h') {
        var llindar = Math.min(60, finestresEl.clientWidth * 0.18);
        var nou = finIndex;
        if (mx < -llindar) nou++;
        else if (mx > llindar) nou--;
        vesAFinestra(nou);
        suprimeixClic();
      } else if (mode === 'v' && my < -45 && Math.abs(my) > Math.abs(mx) * 1.3 && Date.now() - t0 < 900) {
        var potTancar = desDeCap || !cos || cos.scrollHeight <= cos.clientHeight + 2;
        if (potTancar) { tancaFinestres(); suprimeixClic(); }
      }
      mode = null;
    });
    window.addEventListener('pointercancel', function(){
      if (!actiu) return;
      actiu = false;
      if (mode === 'h') vesAFinestra(finIndex);
      mode = null;
    });
    /* Trackpad del Mac: lliscament lateral amb dos dits */
    var ultimaRoda = 0;
    finestresEl.addEventListener('wheel', function(e){
      if (Math.abs(e.deltaX) < 25 || Math.abs(e.deltaX) < Math.abs(e.deltaY)) return;
      e.preventDefault();
      var ara = Date.now();
      if (ara - ultimaRoda < 500) return;
      ultimaRoda = ara;
      vesAFinestra(finIndex + (e.deltaX > 0 ? 1 : -1));
    }, { passive: false });
  })();

  /* Teclat (Mac): ↓ obre, ← → passa finestres o mesos, ↑ / Esc torna al calendari */
  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (finestresObertes()) {
      if (e.key === 'ArrowRight') vesAFinestra(finIndex + 1);
      else if (e.key === 'ArrowLeft') vesAFinestra(finIndex - 1);
      else if (e.key === 'Escape' || e.key === 'ArrowUp') tancaFinestres();
      else return;
    } else {
      if (e.key === 'ArrowDown') obreFinestres();
      else if (e.key === 'ArrowRight') canviaMes(1);
      else if (e.key === 'ArrowLeft') canviaMes(-1);
      else return;
    }
    e.preventDefault();
  });

  /* ---- Finestra 1: ubicació ---- */
  function formataCoord(v, pos, neg) {
    if (v == null) return '--';
    return Math.abs(v).toFixed(4).replace('.', ',') + '° ' + (v >= 0 ? pos : neg);
  }
  function renderUbicacio() {
    document.getElementById('ubPoblacio').textContent = dades.poblacio || '--';
    document.getElementById('ubRegio').textContent = dades.regio || (lastCoords ? '' : 'Cal permetre la ubicació');
    document.getElementById('ubLat').textContent = formataCoord(dades.lat, 'N', 'S');
    document.getElementById('ubLon').textContent = formataCoord(dades.lon, 'E', 'O');
    document.getElementById('ubAlt').textContent = dades.altitud != null ? dades.altitud + ' m' : '--';
  }

  /* ---- Finestra 2: el temps i alertes ----
     Alertes derivades de les dades d'Open-Meteo (situació actual i properes hores),
     no són els avisos oficials del Meteocat. */
  var ICONES_ALERTA = {
    pluja: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 15a5 5 0 1 1 1.5-9.8A6 6 0 0 1 19 9a4 4 0 0 1-1 7.9H7z"/><path d="M9 19l-1 2M13 19l-1 2M17 19l-1 2"/></svg>',
    neu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>',
    glacades: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14.8V5a2 2 0 1 1 4 0v9.8a4 4 0 1 1-4 0z"/><path d="M12 11v6"/></svg>',
    vent: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8"/></svg>'
  };
  function renderTemps() {
    document.getElementById('tmTemp').textContent = dades.temp != null ? dades.temp + ' °C' : '--';
    document.getElementById('tmHum').textContent = dades.humitat != null ? dades.humitat + ' %' : '--';
    document.getElementById('tmSens').textContent = dades.sensacio != null ? dades.sensacio + ' °C' : '--';
    document.getElementById('tmVent').textContent = dades.vent != null ? dades.vent + ' km/h' : '--';
    var cont = document.getElementById('tmAlertes');
    cont.innerHTML = '';
    if (dades.temp == null) {
      cont.innerHTML = '<span class="sense-alertes">Sense dades del temps</span>';
    } else if (!dades.alertes.length) {
      cont.innerHTML = '<span class="sense-alertes">Cap alerta de pluja, neu, glaçades ni vent fort</span>';
    } else {
      dades.alertes.forEach(function(a){
        var x = document.createElement('span');
        x.className = 'alerta-xip';
        x.innerHTML = ICONES_ALERTA[a.tipus] + '<span></span><small></small>';
        x.children[1].textContent = a.nom;
        x.children[2].textContent = a.detall;
        cont.appendChild(x);
      });
    }
    document.getElementById('tmPeu').textContent = dades.actualitzat
      ? 'Open-Meteo · actualitzat a les ' + pad2(dades.actualitzat.getHours()) + ':' + pad2(dades.actualitzat.getMinutes())
      : '';
    marcaScrollables();
  }

  var CODIS_PLUJA = [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99];
  var CODIS_NEU = [71, 73, 75, 77, 85, 86];
  function numero(v) { return Math.round(v * 10) / 10; }
  function calculaAlertes(data) {
    var cur = data.current, h = data.hourly || {};
    var alertes = [];
    var properes = function(arr, n) { return (arr || []).slice(0, n).filter(function(v){ return v != null; }); };
    var plujaHores = properes(h.precipitation, 3).reduce(function(s, v){ return s + v; }, 0);
    var neuHores = properes(h.snowfall, 6).reduce(function(s, v){ return s + v; }, 0);
    var ratxes = Math.max.apply(null, [cur.wind_gusts_10m || 0].concat(properes(h.wind_gusts_10m, 3)));
    var minima = Math.min.apply(null, [cur.temperature_2m].concat(properes(h.temperature_2m, 12)));

    if (CODIS_NEU.indexOf(cur.weather_code) !== -1 || neuHores > 0) {
      alertes.push({ tipus: 'neu', nom: 'Neu', detall: CODIS_NEU.indexOf(cur.weather_code) !== -1 ? 'ara' : 'properes hores' });
    }
    if (CODIS_PLUJA.indexOf(cur.weather_code) !== -1 || plujaHores >= 0.5) {
      alertes.push({ tipus: 'pluja', nom: 'Pluja', detall: CODIS_PLUJA.indexOf(cur.weather_code) !== -1 ? 'ara' : String(numero(plujaHores)).replace('.', ',') + ' mm en 3 h' });
    }
    if (minima <= 0) {
      alertes.push({ tipus: 'glacades', nom: 'Glaçades', detall: 'mín. ' + Math.round(minima) + ' °C' });
    }
    if (ratxes >= 60) {
      alertes.push({ tipus: 'vent', nom: 'Vent fort', detall: 'ratxes de ' + Math.round(ratxes) + ' km/h' });
    }
    dades.ratxes = Math.round(ratxes);
    return alertes;
  }

  function fetchWeather(lat, lon) {
    fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
          '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_gusts_10m' +
          '&hourly=temperature_2m,precipitation,snowfall,wind_gusts_10m&forecast_hours=12' +
          '&daily=sunrise,sunset&timezone=auto')
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data && data.current) {
          dades.temp = Math.round(data.current.temperature_2m);
          dades.humitat = Math.round(data.current.relative_humidity_2m);
          dades.sensacio = Math.round(data.current.apparent_temperature);
          dades.vent = Math.round(data.current.wind_speed_10m);
          dades.alertes = calculaAlertes(data);
          dades.actualitzat = new Date();
          renderTemps();
        }
        if (data && data.daily && data.daily.sunrise && data.daily.sunset) {
          sortidaSol = new Date(data.daily.sunrise[0]);
          postaSol = new Date(data.daily.sunset[0]);
          try {
            localStorage.setItem('domaineSortidaMin', String(sortidaSol.getHours() * 60 + sortidaSol.getMinutes()));
            localStorage.setItem('domainePostaMin', String(postaSol.getHours() * 60 + postaSol.getMinutes()));
          } catch (e) {}
          aplicarTemaAutomatic();
        }
      })
      .catch(function(){});
  }

  /* ---- Reproductor únic per a podcasts i ràdios ---- */
  var audio = new Audio();
  audio.preload = 'none';
  var sonant = null;   /* { id, titol, sub, web, tipus } */
  var araSonaBtn = document.getElementById('araSona');
  var ICONA_MINI_PLAY = '<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z" fill="currentColor"/></svg>';
  var ICONA_MINI_PAUSA = '<svg viewBox="0 0 10 10"><path d="M2 1h2.2v8H2zM5.8 1H8v8H5.8z" fill="currentColor"/></svg>';

  function avis(text, ms) {
    if (!soundHint) return;
    soundHint.textContent = text;
    soundHint.classList.add('visible');
    if (soundHintTimer) clearTimeout(soundHintTimer);
    soundHintTimer = setTimeout(function(){ soundHint.classList.remove('visible'); }, ms || 4500);
  }

  function actualitzaEstatSo() {
    var sona = sonant && !audio.paused;
    document.querySelectorAll('[data-audio-id]').forEach(function(el){
      var meu = sonant && el.getAttribute('data-audio-id') === sonant.id;
      el.classList.toggle('sonant', !!(meu && sona));
      el.classList.toggle('carregant', !!(meu && sona && audio.readyState < 3));
      var barra = el.querySelector('.prog-barra');
      if (barra && !meu) barra.style.width = '0';
    });
    araSonaBtn.classList.toggle('visible', !!sonant);
    if (sonant) {
      document.getElementById('araSonaIc').innerHTML = sona ? ICONA_MINI_PAUSA : ICONA_MINI_PLAY;
      document.getElementById('araSonaTx').textContent = sonant.titol + (sonant.sub ? ' · ' + sonant.sub : '');
    }
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = sonant ? (sona ? 'playing' : 'paused') : 'none';
  }

  function reprodueix(item) {
    if (sonant && sonant.id === item.id) {
      if (audio.paused) audio.play().catch(function(){});
      else audio.pause();
      return;
    }
    sonant = item;
    audio.src = item.audio;
    audio.play().catch(function(){});
    if ('mediaSession' in navigator && window.MediaMetadata) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: item.titol + (item.sub ? ' · ' + item.sub : ''),
        artist: item.tipus === 'radio' ? 'En directe' : 'RAC1',
        artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }]
      });
    }
    actualitzaEstatSo();
  }

  ['play', 'playing', 'pause', 'waiting', 'canplay', 'ended'].forEach(function(ev){
    audio.addEventListener(ev, actualitzaEstatSo);
  });
  audio.addEventListener('timeupdate', function(){
    if (!sonant || sonant.tipus !== 'podcast' || !audio.duration) return;
    var el = document.querySelector('[data-audio-id="' + sonant.id + '"] .prog-barra');
    if (el) el.style.width = (audio.currentTime / audio.duration * 100) + '%';
  });
  audio.addEventListener('error', function(){
    if (!sonant || !audio.getAttribute('src')) return;
    var fallat = sonant;
    sonant = null;
    actualitzaEstatSo();
    if (fallat.tipus === 'radio') {
      var tile = document.querySelector('[data-audio-id="' + fallat.id + '"]');
      if (tile) tile.setAttribute('data-nomes-web', '1');
      avis('No es pot reproduir aquí: torna a tocar ' + fallat.titol + ' per obrir la seva web', 6000);
    } else {
      avis('No s\'ha pogut reproduir. Fes servir la fletxa ↗ per obrir-lo a la web', 6000);
    }
  });
  araSonaBtn.addEventListener('click', function(){
    if (!sonant) return;
    if (audio.paused) audio.play().catch(function(){}); else audio.pause();
  });
  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', function(){ audio.play().catch(function(){}); });

  var OMNY_ORG = '47dc05c7-7279-4c6f-9b31-ae74013297d9';

  var NUM_DIA = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  var fmtMadrid = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Madrid', weekday: 'short', day: 'numeric', month: 'numeric', hour: '2-digit', hourCycle: 'h23' });
  function horaMadrid(d) {

  function clipsOmny(prog) {

      .then(function(j){

  function clipsApple(prog) {

      var t = setTimeout(function(){ neteja(); reject(new Error('apple')); }, 12000);
      function neteja() { clearTimeout(t); try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); }
      window[cb] = function(j){
        neteja();

    var ara = Date.now(), perDia = {};
    clips.forEach(function(cl){
      if (!cl.audio || isNaN(cl.data) || cl.data.getTime() > ara) return;
      var m = horaMadrid(cl.data);
      if (dies.indexOf(m.dow) === -1) return;
      if (hora != null && m.hora !== hora) return;
      if (!perDia[m.dow] || cl.data > perDia[m.dow].data) { cl.m = m; perDia[m.dow] = cl; }
    });
    return Object.keys(perDia).map(function(k){ return perDia[k]; }).sort(function(a, b){ return a.data - b.data; });

  function fetchElevation(lat, lon) {
    fetch('https://api.open-meteo.com/v1/elevation?latitude=' + lat + '&longitude=' + lon)
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data && data.elevation && data.elevation.length) {
          dades.altitud = Math.round(data.elevation[0]);
          renderUbicacio();
        }
      })
      .catch(function(){});
  }

  function fetchLocationName(lat, lon) {
    fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lon + '&localityLanguage=ca')
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data) {
          dades.poblacio = data.locality || data.city || data.principalSubdivision || data.countryName || '--';
          var regio = [];
          if (data.principalSubdivision && data.principalSubdivision !== dades.poblacio) regio.push(data.principalSubdivision);
          if (data.countryName) regio.push(data.countryName);
          dades.regio = regio.join(' · ');
          renderUbicacio();
        }
      })
      .catch(function(){});
  }

  function refreshAll(lat, lon) {

  function requestLocationAndData() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      function(pos){
        lastCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };

        /* Si el dispositiu proporciona altitud GPS real (mòbils amb GPS), la fem servir en lloc de l'elevació del terreny */
        if (pos.coords.altitude !== null && pos.coords.altitude !== undefined && !isNaN(pos.coords.altitude)) {
          dades.altitud = Math.round(pos.coords.altitude);
          renderUbicacio();

          fetchElevation(lastCoords.lat, lastCoords.lon);

  /* ---- Rellotge de campanades: gir horari + Mi als quarts, Do greu a les hores ---- */
  var clockFlip = document.getElementById('clockFlip');

  /* El gir en 3D nomes te dues cares (davant i darrere) separades per
     l'eix Z; vistes de cantell (a mig gir) deixaven un buit transparent
     entre elles. Ho arreglem apilant moltes capes negres intermedies
     que omplen tot el gruix, com les parets d'un cilindre tancat. */
  (function buildClosedCylinder(){
    var depths = [];
    for (var z = -19; z <= 19; z += 2) depths.push(z);
    depths.forEach(function(z){
      var layer = document.createElement('div');
      layer.className = 'clock-edge';
      layer.style.transform = 'translateZ(' + z + 'px)';
      clockFlip.insertBefore(layer, clockFlip.firstChild);
    });
  })();

  /* Tot el so del rellotge es sintetitza amb Web Audio API (cap arxiu
     d'àudio incrustat): aixo el fa mes lleuger i evita qualsevol
     problema de compatibilitat de descodificacio entre navegadors. */
  var audioCtx = null;
  function obtenirAudioCtx() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { return null; }
    }
    if (audioCtx.state === 'suspended') { audioCtx.resume().catch(function(){}); }
    return audioCtx;
  }
  function assegurarContextActiu() {
    var ctx = obtenirAudioCtx();
    if (!ctx) return Promise.resolve(null);
    if (ctx.state === 'running') return Promise.resolve(ctx);
    return ctx.resume().then(function () { return ctx; }).catch(function () { return ctx; });
  }

  /* Preferencia de so, recordada entre visites. Per defecte activat. */
  var sonaActiu = true;
  try { sonaActiu = localStorage.getItem('domaineSo') !== 'off'; } catch (e) {}

  /* Notes de les campanades: Mi als quarts i Do greu a les hores,
     l'interval mes harmonic per aquest us -una tercera major
     descendent (Mi -> Do)-: càlid, dolç i melodic. */
  var MI_FREQ = 329.63;  /* Mi4 (E4), quarts */
  var DO_FREQ = 261.63;  /* Do4 (C4), "greu" respecte al Mi, hores */
  var HORA_STEP = 0.85;  /* separacio (s) entre cada campanada de l'hora */

  /* Campana sintetitzada: uns quants parcials no harmonics (relacions
     no enteres entre si) que li donen aquell timbre metal·lic i càlid
     d'una campana real, cada un apagant-se a un ritme una mica diferent. */
  var PARCIALS_CAMPANA = [
    { mul: 1.00, guany: 1.00, decaiment: 1.00 },
    { mul: 2.01, guany: 0.55, decaiment: 0.85 },
    { mul: 2.41, guany: 0.30, decaiment: 0.68 },
    { mul: 3.04, guany: 0.16, decaiment: 0.52 },
    { mul: 4.12, guany: 0.09, decaiment: 0.38 }
  ];
  function reproduirCampana(freqBase, ctxTime, guanyPic, durBase) {
    var ctx = obtenirAudioCtx();
    if (!ctx) return;
    PARCIALS_CAMPANA.forEach(function (p) {
      var osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freqBase * p.mul;
      var g = ctx.createGain();
      var pic = guanyPic * p.guany;
      var dur = durBase * p.decaiment;
      g.gain.setValueAtTime(0.0001, ctxTime);
      g.gain.linearRampToValueAtTime(pic, ctxTime + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0004, ctxTime + dur);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(ctxTime);
      osc.stop(ctxTime + dur + 0.05);
    });
  }

  /* "Cloc" mecanic sintetitzat: un breu impacte de soroll filtrat (el
     "clic" del pestell) mes un cop de triangle greu (el "clonc" del
     mecanisme en assentar-se). Marca l'instant exacte en que el gir
     s'atura i l'esfera torna a mirar cap endavant. */
  function reproduirCloc() {
    if (!sonaActiu) return;
    var ctx = obtenirAudioCtx();
    if (!ctx) return;
    var quan = ctx.currentTime;
    var midaBufer = Math.max(1, Math.floor(ctx.sampleRate * 0.015));
    var buffer = ctx.createBuffer(1, midaBufer, ctx.sampleRate);
    var dades = buffer.getChannelData(0);
    for (var i = 0; i < midaBufer; i++) {
      dades[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / midaBufer, 1.5);
    }
    var src = ctx.createBufferSource();
    src.buffer = buffer;
    var filtre = ctx.createBiquadFilter();
    filtre.type = 'lowpass';
    filtre.frequency.value = 1800;
    var gainClic = ctx.createGain();
    gainClic.gain.value = 0.5;
    src.connect(filtre);
    filtre.connect(gainClic);
    gainClic.connect(ctx.destination);
    src.start(quan);
    src.stop(quan + 0.02);

    var osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, quan);
    osc.frequency.exponentialRampToValueAtTime(60, quan + 0.12);
    var gainThump = ctx.createGain();
    gainThump.gain.setValueAtTime(0.0001, quan);
    gainThump.gain.linearRampToValueAtTime(0.5, quan + 0.008);
    gainThump.gain.exponentialRampToValueAtTime(0.0008, quan + 0.22);
    osc.connect(gainThump);
    gainThump.connect(ctx.destination);
    osc.start(quan);
    osc.stop(quan + 0.25);
  }

  var soundHint = document.getElementById('soundHint');
  var soundHintTimer = null;
  function mostrarAvisSo() {
    if (!soundHint) return;
    soundHint.textContent = 'Toca la pantalla per activar el so de les campanes';
    soundHint.classList.add('visible');
    if (soundHintTimer) clearTimeout(soundHintTimer);
    soundHintTimer = setTimeout(function () {
      soundHint.classList.remove('visible');
    }, 6000);
  }
  function amagarAvisSo() {
    if (!soundHint) return;
    soundHint.classList.remove('visible');
    if (soundHintTimer) { clearTimeout(soundHintTimer); soundHintTimer = null; }
  }

  /* Molts navegadors bloquegen l'àudio si encara no hi ha hagut cap
     interacció amb la pàgina, i tambe el suspenen sols si porta una
     estona sense sonar res (per estalviar bateria). Aprofitem el
     primer toc o tecla -o el boto del so- per despertar-lo. */
  function unlockAudio() {
    amagarAvisSo();
    assegurarContextActiu();
  }
  document.addEventListener('pointerdown', unlockAudio, { once: true });
  document.addEventListener('keydown', unlockAudio, { once: true });

  /* Campanada dels quarts: un sol toc de Mi, sense gir de l'esfera
     -nomes l'hora en punt fa girar el mecanisme. */
  function tocarQuart() {
    if (!sonaActiu) { return; }
    assegurarContextActiu().then(function (ctx) {
      if (!ctx || ctx.state !== 'running') { mostrarAvisSo(); return; }
      reproduirCampana(MI_FREQ, ctx.currentTime + 0.03, 0.5, 1.3);
    });
  }

  /* Campanades de l'hora: tantes campanades de Do greu com toca
     l'hora (format de 12), espaiades a un ritme clar i pausat. */
  function tocarHores(count) {
    if (!sonaActiu) return;
    assegurarContextActiu().then(function (ctx) {
      if (!ctx || ctx.state !== 'running') { mostrarAvisSo(); return; }
      var t0 = ctx.currentTime + 0.05;
      for (var i = 0; i < count; i++) {
        reproduirCampana(DO_FREQ, t0 + i * HORA_STEP, 0.62, 1.5);
      }
    });
  }

  /* El gir sempre dura 10 segons exactes, independentment de quantes
     campanades toquin (com molt, a les 12, la sequencia de campanades
     dura uns 9,4s, de manera que sempre acaba abans que el gir
     s'aturi). El "cloc" final es reprodueix a l'animationend, així
     que sempre coincideix amb el final real del gir. */
  var SPIN_MS = 10000;

  function spinAndChime(count) {
    if (!clockFlip || clockFlip.classList.contains('girant')) return;
    clockFlip.style.setProperty('--gir-dur', (SPIN_MS / 1000) + 's');
    tocarHores(count);
    clockFlip.classList.add('girant');
  }

  clockFlip.addEventListener('animationend', function () {
    clockFlip.classList.remove('girant');
    reproduirCloc();
  });

  /* Toca als quarts i a les hores en punt, com un rellotge de torre
     real. La pàgina només actualitza el rellotge quan la pestanya és
     visible i activa (el navegador pausa requestAnimationFrame en
     segon pla), així que si el mòbil estava bloquejat o la pestanya
     en segon pla exactament al quart o a l'hora en punt, es podria
     perdre l'instant exacte. Per cobrir-ho: 1) donem un marge de 20
     segons en lloc d'exigir el segon 0 exacte, 2) en recuperar el
     focus de la pestanya, comprovem si acabem de passar un quart o
     una hora sense haver tocat encara. Si el dispositiu ha estat
     inactiu mes d'aquest marge (p. ex. tota la nit), aquell toc
     concret es perd igualment: no hi ha manera d'executar codi de
     pàgina mentre la pestanya està totalment aturada. */
  var lastChimedKey = null;
  var MARGE_TOC_S = 20;
  function clauMinut(now) {
    return now.getFullYear() + '-' + now.getMonth() + '-' + now.getDate() + '-' + now.getHours() + '-' + now.getMinutes();
  }
  function comptaCucuts(hh) {
    var count = hh % 12;
    return count === 0 ? 12 : count;
  }
  function checkHourlyChime(now) {
    var mm = now.getMinutes();
    if (mm !== 0 && mm !== 15 && mm !== 30 && mm !== 45) return;
    if (now.getSeconds() >= MARGE_TOC_S) return;
    var key = clauMinut(now);
    if (lastChimedKey === key) return;
    lastChimedKey = key;
    if (mm === 0) {
      spinAndChime(comptaCucuts(now.getHours()));
    } else {
      tocarQuart();
    }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') checkHourlyChime(new Date());
  });

  /* Boto per activar/desactivar el so */
  var soundBtn = document.getElementById('soundBtn');
  var ICONA_SO_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  var ICONA_SO_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>';
  function actualitzarIconaSo() {
    if (!soundBtn) return;
    soundBtn.innerHTML = sonaActiu ? ICONA_SO_ON : ICONA_SO_OFF;
    soundBtn.setAttribute('aria-label', sonaActiu ? 'Desactivar el so' : 'Activar el so');
    soundBtn.setAttribute('aria-pressed', sonaActiu ? 'true' : 'false');
  }
  actualitzarIconaSo();
  if (soundBtn) {
    soundBtn.addEventListener('click', function () {
      sonaActiu = !sonaActiu;
      try { localStorage.setItem('domaineSo', sonaActiu ? 'on' : 'off'); } catch (e) {}
      actualitzarIconaSo();
      if (sonaActiu) { unlockAudio(); }
      else { amagarAvisSo(); }
    });
  }

  /* Botó de mode: diürn (clar), nocturn (fosc) i zzz (negre i taronja vermellós).
     Automàtic: zzz de 23 h a 7 h; de dia, clar entre la sortida i la posta de sol reals del lloc
     (7 h-20 h mentre no se saben) i fosc la resta. Tocar el botó passa al mode següent; la tria
     dura fins al següent canvi automàtic (7 h, sortida de sol, posta de sol o 23 h). */
  var themeBtn = document.getElementById('themeBtn');
  var sortidaSol = null, postaSol = null;
  var ICONA_SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>';
  var ICONA_LLUNA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>';
  var ICONA_ZZZ = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5h6l-6 7h6"/><path d="M12.5 6.5h4.5l-4.5 5h4.5"/><path d="M18.5 2.5h3l-3 3.5h3"/></svg>';
  var ORDRE_MODES = ['clar', 'fosc', 'zzz'];
  var NOMS_MODE = { clar: 'Mode diürn', fosc: 'Mode nocturn', zzz: 'Mode zzz' };

  function actualitzarIconaTema(tema) {
    if (!themeBtn) return;
    themeBtn.innerHTML = tema === 'clar' ? ICONA_SOL : (tema === 'fosc' ? ICONA_LLUNA : ICONA_ZZZ);
    themeBtn.setAttribute('aria-label', NOMS_MODE[tema] + '. Toca per canviar de mode');
    themeBtn.title = NOMS_MODE[tema];
  }
  function aplicarTema(tema) {
    document.documentElement.setAttribute('data-theme', tema === 'clar' ? 'light' : (tema === 'zzz' ? 'zzz' : 'dark'));
    var meta = document.getElementById('metaThemeColor');
    if (meta) meta.setAttribute('content', tema === 'clar' ? '#f4f2ec' : '#000000');
    actualitzarIconaTema(tema);
  }
  function temaActual() {
    var t = document.documentElement.getAttribute('data-theme');
    return t === 'light' ? 'clar' : (t === 'zzz' ? 'zzz' : 'fosc');
  }
  function minutsDe(d) { return d.getHours() * 60 + d.getMinutes(); }
  function limitsSol() {
    return { sortida: sortidaSol ? minutsDe(sortidaSol) : 420, posta: postaSol ? minutsDe(postaSol) : 1200 };
  }
  function temaAutomatic(ara) {
    var h = ara.getHours();
    if (h >= 23 || h < 7) return 'zzz';
    var m = minutsDe(ara), l = limitsSol();
    return (m >= l.sortida && m < l.posta) ? 'clar' : 'fosc';
  }
  /* Proper moment en què el mode automàtic pot canviar */
  function properCanviTema(ara) {
    var l = limitsSol(), punts = [420, l.sortida, l.posta, 1380], millor = null;
    for (var dia = 0; dia < 2; dia++) {
      punts.forEach(function(min){
        var d = new Date(ara.getFullYear(), ara.getMonth(), ara.getDate() + dia, Math.floor(min / 60), min % 60);
        if (d > ara && (!millor || d < millor)) millor = d;
      });
    }
    return millor;
  }

  function aplicarTemaAutomatic() {
    var manual = null, fins = 0;
    try {
      manual = localStorage.getItem('domaineTemaManual');
      fins = parseInt(localStorage.getItem('domaineTemaManualFins'), 10) || 0;
    } catch (e) {}
    var ara = new Date();
    if (ORDRE_MODES.indexOf(manual) !== -1) {
      if (fins && ara.getTime() < fins) return;
      try {
        localStorage.removeItem('domaineTemaManual');
        localStorage.removeItem('domaineTemaManualFins');
      } catch (e) {}
    }
    var t = temaAutomatic(ara);
    if (t !== temaActual()) aplicarTema(t);
  }
  actualitzarIconaTema(temaActual());
  if (themeBtn) {
    themeBtn.addEventListener('click', function () {
      var nou = ORDRE_MODES[(ORDRE_MODES.indexOf(temaActual()) + 1) % ORDRE_MODES.length];
      try {
        localStorage.setItem('domaineTemaManual', nou);
        localStorage.setItem('domaineTemaManualFins', String(properCanviTema(new Date()).getTime()));
      } catch (e) {}
      aplicarTema(nou);
    });
  }

  /* Pantalla sempre encesa mentre l'app és oberta i visible (Screen Wake Lock):
     evita que el Mac o l'iPhone apaguin la pantalla o entrin en repòs. El sistema
     l'allibera en amagar la pàgina, i es torna a demanar en tornar-hi. */
  var wakeLock = null;
  function demanaPantallaActiva() {
    if (!('wakeLock' in navigator) || wakeLock || document.visibilityState !== 'visible') return;
    navigator.wakeLock.request('screen').then(function(wl){
      wakeLock = wl;
      wl.addEventListener('release', function(){ wakeLock = null; });
    }).catch(function(){});
  }
  demanaPantallaActiva();
  document.addEventListener('visibilitychange', demanaPantallaActiva);
  document.addEventListener('pointerdown', demanaPantallaActiva);
  window.addEventListener('focus', demanaPantallaActiva);

  /* Petita demostracio en obrir la pàgina: fa girar l'esfera i tocar
     3 campanades de Do, perque es pugui veure el mecanisme sense
     esperar a la propera hora en punt. */
  setTimeout(function () { spinAndChime(3); }, 4000);

  requestLocationAndData();
  setInterval(function(){
    if (lastCoords) refreshAll(lastCoords.lat, lastCoords.lon);
    else requestLocationAndData();
  }, 15 * 60 * 1000);
})();
</script>

<script>
/* Registre del service worker: permet instal·lar l'app i obrir-la sense connexió */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
